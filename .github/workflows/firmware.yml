name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'esp32-firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'esp32-firmware/**'
      - '.github/workflows/firmware.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32
          path: esp32-firmware

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            esp32-firmware/build/*.bin
            esp32-firmware/build/*.elf
            esp32-firmware/build/flash_args
            esp32-firmware/build/bootloader/bootloader.bin
            esp32-firmware/build/partition_table/partition-table.bin
          if-no-files-found: error

  release:
    # Long-term this is what the firmware's OTA check polls (GitHub Releases
    # "latest" API). Keep the asset a plain .bin at a predictable name.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: firmware

      - name: Attach firmware to release
        uses: softprops/action-gh-release@v3
        with:
          files: firmware/*.bin
