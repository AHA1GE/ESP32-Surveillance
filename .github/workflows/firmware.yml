name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'esp32-firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'esp32-firmware/**'
      - '.github/workflows/firmware.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          target: esp32
          path: esp32-firmware
          # idf.py merge-bin packs bootloader + partition table + otadata +
          # app from the project config into one build/merged-binary.bin,
          # flashable at 0x0.
          command: idf.py build && idf.py merge-bin -f raw

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            esp32-firmware/build/*.bin
            esp32-firmware/build/*.elf
            esp32-firmware/build/flash_args
            esp32-firmware/build/bootloader/bootloader.bin
            esp32-firmware/build/partition_table/partition-table.bin
          if-no-files-found: error

  release:
    # Long-term this is what the firmware's OTA check polls (GitHub Releases
    # "latest" API). Attach only the app image: ota.c downloads the first
    # .bin asset it finds, so merged-binary.bin and the other bins must not
    # be attached or devices could OTA-flash the wrong image.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: firmware

      - name: Attach firmware to release
        uses: softprops/action-gh-release@v3
        with:
          files: firmware/esp32-surveillance-firmware.bin
