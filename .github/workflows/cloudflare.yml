# Type-check the Cloudflare Worker on PRs. Deployment stays manual
# (`npx wrangler deploy`), matching the workflow split for the backend:
# Harry pushes/deploys; the repository only builds/checks.
name: Cloudflare

on:
  pull_request:
    paths:
      - "cloudflare/**"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
